name: 河南政府采购网监控

on:
  schedule:
    # ⏰ 北京时间 09:00 = UTC 01:00
    - cron: "0 1 * * *"
    # ⏰ 北京时间 17:30 = UTC 09:30
    - cron: "30 9 * * *"
  workflow_dispatch:  # 允许手动触发（Actions 页面点 Run workflow）

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 下载去重数据库（Artifacts）
        uses: actions/download-artifact@v4
        with:
          name: dedup-db
          path: ./
        continue-on-error: true   # 第一次没数据库时跳过

      - name: 运行监控脚本
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python henan_monitor.py

      - name: 上传去重数据库（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: dedup-db
          path: henan_zfcg_v2.db
          retention-days: 30
